<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>페이지를 찾을 수 없습니다</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem 1.25rem;
      background: #f4efe6;
      color: #16141c;
      font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      font-size: 1.125rem;
      line-height: 1.6;
      text-align: center;
    }
    p { margin: 0; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 44px;
      padding: 0.6rem 1.15rem;
      color: #16141c;
      text-decoration: underline;
      text-underline-offset: 0.2em;
      font-weight: 600;
    }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible {
      outline: 3px solid #16141c;
      outline-offset: 3px;
      background: #fff;
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <p>페이지를 찾을 수 없습니다</p>
  <p><a href="/">홈으로</a></p>
</body>
</html>
